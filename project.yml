name: Para
options:
  bundleIdPrefix: com.volchuk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Para:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para
        INFOPLIST_KEY_CFBundleDisplayName: Двоє
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Двоє
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Para.entitlements
      properties:
        com.apple.security.application-groups: [group.com.volchuk.para]
    dependencies:
      - target: ParaWidget
  ParaWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Двоє
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ParaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.volchuk.para]
schemes:
  Para:
    build:
      targets:
        Para: all
        ParaWidget: all
