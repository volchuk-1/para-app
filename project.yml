name: Para
options:
  bundleIdPrefix: com.volchuk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Para:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para
        INFOPLIST_KEY_CFBundleDisplayName: DaVincit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DaVincit
        UILaunchScreen:
          UIColorName: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.volchuk.para
            CFBundleURLSchemes: [davincit]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "Щоб керувати Nyx напряму, без застосунку Magic Motion: сила, ритми, батарея. Нікуди не надсилається."
        NSCalendarsFullAccessUsageDescription: "Щоб наші побачення й події були в календарі телефона, а DaVincit знав, коли ви зайняті (лише час, без назв)."
        NSCalendarsWriteOnlyAccessUsageDescription: "Щоб додати побачення у календар телефона з нагадуванням."
        NSPhotoLibraryAddUsageDescription: "Щоб зберегти фото від партнера у «Фото» на телефоні."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Лише дорогою на побачення і лише з вашої згоди: показати партнерові, де ви, і порахувати час у дорозі."
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: "Мікрофон потрібен для голосових нотаток."
        NSCameraUsageDescription: "Камера потрібна, щоб відсканувати штрихкод книжки і зняти фото для гри."
        NSPhotoLibraryUsageDescription: "Фото з галереї — для спогадів, аватарки і гри «Три в ряд»."
        NSLocationWhenInUseUsageDescription: "Місце потрібне, щоб запам'ятати, де зроблено фото, порахувати дорогу на побачення і — лише з вашої згоди — показати партнерові, де ви дорогою туди."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Para.entitlements
      properties:
        com.apple.security.application-groups: [group.com.volchuk.para]
    dependencies:
      - target: ParaWidget
      - target: ParaShare
  ParaWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DaVincit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ParaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.volchuk.para]
  ParaShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para.share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: DaVincit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
            NSExtensionJavaScriptPreprocessingFile: Preprocess
    entitlements:
      path: Share/ParaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.volchuk.para]
  ParaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.para.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Para:
    build:
      targets:
        Para: all
        ParaWidget: all
        ParaShare: all
    test:
      targets: [ParaTests]
