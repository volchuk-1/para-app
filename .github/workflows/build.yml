name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*' | sed 's/ *$//')
          echo "Simulator: $SIM"
          xcodebuild test -project Para.xcodeproj -scheme Para             -destination "platform=iOS Simulator,name=$SIM"             CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|error:|failed|passed|Executed|\*\* TEST" | tail -n 80

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Para.xcodeproj -scheme Para -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package .ipa (ad-hoc sign so SideStore sees the entitlements)
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/Para.app
          ls "$APP" "$APP/PlugIns"
          codesign --force --sign - --entitlements Widget/ParaWidget.entitlements "$APP/PlugIns/ParaWidget.appex"
          codesign --force --sign - --entitlements Share/ParaShare.entitlements "$APP/PlugIns/ParaShare.appex"
          codesign --force --sign - --entitlements App/Para.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Para.ipa Payload
          ls -la Para.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Para-ipa
          path: Para.ipa

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Para.ipa --title "Збірка ${{ github.run_number }}" --notes "Коміт ${{ github.sha }}"
